steps:
  # Step 1 – Build React frontend
  - name: 'node:18-alpine'
    entrypoint: sh
    args:
      - '-c'
      - 'cd frontend && npm ci && npm run build'

  # Step 2 – Build Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/medicare', '.']

  # Step 3 – Push to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/medicare']

  # Step 4 – Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'medicare'
      - '--image=gcr.io/$PROJECT_ID/medicare'
      - '--region=us-central1'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--port=8080'
      - '--memory=512Mi'
      - '--cpu=1'
      - '--min-instances=0'
      - '--max-instances=10'

images:
  - 'gcr.io/$PROJECT_ID/medicare'

timeout: '1200s'
